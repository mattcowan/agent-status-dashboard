# Runs a Claude review on a pull request only when the repo owner mentions
# @claude in a PR comment, review comment or review body (for example
# "@claude review"). Nothing runs on push, so it only uses Claude plan
# usage and Actions minutes when asked. Claude can read the repo and comment
# on the PR, but it cannot commit or push (see the action inputs below).
#
# GitHub runs issue_comment workflows only from the default branch, and the
# app token exchange rejects a workflow that differs from it. So @claude
# does nothing on the PR that adds or changes this file until it is merged.
#
# Only the owner can start a run. Before writing @claude on a pull request
# from a fork, read the change first: Claude then reads code that someone else
# wrote, and text in it can try to steer the review. The token is read-only,
# which limits what a steered run can do, but its comments still post as Claude.
#
# Setup, one time:
#   1. Run `claude setup-token` (works on Pro and Max) and copy the token.
#   2. Add it as the repo secret CLAUDE_CODE_OAUTH_TOKEN:
#      gh secret set CLAUDE_CODE_OAUTH_TOKEN -R mattcowan/agent-status-dashboard
#   3. Install the Claude GitHub app on this repo: https://github.com/apps/claude
#
# Both actions are pinned to a commit SHA, because a tag such as @v1 can be
# moved and the job holds a token with write access to PRs and issues.
# To update, resolve the new tag to its commit SHA (dereference an annotated
# tag to its commit) and change the comment.
name: Claude review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude') &&
        github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        github.event.review.author_association == 'OWNER')
    # One run per PR at a time. A review whose body and N inline comments all
    # mention @claude fires N+1 events; GitHub keeps one running and only the
    # newest pending, and cancels the rest. Job level, not workflow level, so a
    # comment that skips the job cannot cancel a queued run.
    concurrency:
      group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029 # v1.0.239
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Read-only. The action swaps the OIDC token for a Claude app token
          # with contents: write by default, and on an open PR it pushes to the
          # PR branch. This lowers the app token to contents: read (merged over
          # the defaults), so a push fails whatever Claude tries.
          additional_permissions: |
            contents: read
          # And stop Claude from trying: block the commit and push tools of both
          # commit paths (git CLI by default, the file-ops tools with commit
          # signing). The action pushes through its own wrapper at
          # $GITHUB_ACTION_PATH/scripts/git-push.sh, which "git push" does not
          # match, so the wrapper gets its own rule; "*" may appear anywhere in
          # a Bash rule, and deny rules win over the action's allow list.
          claude_args: >-
            --disallowedTools
            "Bash(git commit:*),Bash(git push:*),Bash(*scripts/git-push.sh*),Bash(git rm:*),mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
